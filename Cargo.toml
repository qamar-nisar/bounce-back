[package]
name = "bounce_back_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
macroquad = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[package.metadata.android]
package_name = "com.bounceback.reconstructed"
label = "Bounce Back"
version_code = 1
version_name = "1.0.0"
assets = "assets"
fullscreen = true
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 23
target_sdk_version = 35

